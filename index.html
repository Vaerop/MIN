<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
            rel="stylesheet">
    </head>
    <body>
        <section class="banner">
            <div>
                <h1 class="textBanner">Онлайн школа <br> программирования</h1>
                <div class="bannerCard">
                    <div class="buttonAndButton">
                        <div class="bannerInput">
                            <input type="text" name id
                                placeholder="Ваше имя">
                            <input type="number" name id
                                placeholder="Ваш номер телефона">
                            <input type="text" name id
                                placeholder="Название курса">
                        </div>
                        <button>Записаться на курс</button>
                    </div>

                    <div>
                        <p>Оставляя заявку, вы даете согласие на обработку
                            персональных данных</p>
                        <label><input type="checkbox" name id> Согласен на
                            получение маркетинговых рассылок</label>
                    </div>

                </div>
            </div>
            <img src="Image/image 1.png" alt="image">
        </section>

        <script src="js/script.js"></script>
    </body>
</html>
